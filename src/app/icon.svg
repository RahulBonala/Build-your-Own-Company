<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Build Your Own Company">
  <!-- Rahul Mark System v2 — Ink field #19140f / orange-500 glyph, 6.4:1
       A kit of parts assembling into one whole. v1 stacked three tapering bars
       and everyone read a wedding cake; three blocks locking into a square say
       "modules" without the pun. Reads as one solid mass at 16px. -->
  <rect width="512" height="512" rx="114" fill="#19140f"/>
  <svg x="84" y="84" width="344" height="344" viewBox="0 0 24 24">
    <g fill="#ff6b1a">
      <rect x="1.6" y="1.6" width="9" height="20.8" rx="2.2"/>
      <rect x="12.6" y="1.6" width="9.8" height="9" rx="2.2"/>
      <rect x="12.6" y="12.6" width="9.8" height="9.8" rx="2.2"/>
    </g>
  </svg>
</svg>
